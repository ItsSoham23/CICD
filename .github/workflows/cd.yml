name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.prep.outputs.image_name }}
      image_tag: ${{ steps.prep.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Registry & Image Names
        id: prep
        run: |
          # Lowercase the repo name to avoid ghcr.io registry push issues
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}"
          # Get short SHA
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.prep.outputs.image_name }}:${{ steps.prep.outputs.image_tag }}
            ${{ steps.prep.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-kind:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup K8s Manifests & Deploy
        shell: pwsh
        run: |
          $IMAGE_NAME = "${{ needs.build-and-push.outputs.image_name }}"
          $IMAGE_TAG = "${{ needs.build-and-push.outputs.image_tag }}"

          (Get-Content k8s/deployment.yaml) `
            -replace 'IMAGE_REPOSITORY_PLACEHOLDER', $IMAGE_NAME `
            -replace 'IMAGE_TAG_PLACEHOLDER', $IMAGE_TAG |
            Set-Content k8s/deployment.yaml

          kubectl apply -f k8s/

      - name: Wait for Rollout to Complete
        shell: pwsh
        run: |
          kubectl rollout status deployment/url-shortener-deployment --timeout=90s
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Post-Deploy Health Check
        shell: pwsh
        run: |
          $job = Start-Job -ScriptBlock {
            kubectl port-forward service/url-shortener-service 8080:3000
          }
          Start-Sleep -Seconds 3

          $success = $false
          for ($i = 1; $i -le 10; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8080/health" -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host "Health check passed with HTTP 200!"
                $success = $true
                break
              }
            } catch {
              Write-Host "Attempt $i : Service not ready yet. Retrying in 3 seconds..."
            }
            Start-Sleep -Seconds 3
          }

          Stop-Job $job
          Remove-Job $job

          if (-not $success) {
            Write-Host "Error: Post-deploy health check failed!"
            exit 1
          }
